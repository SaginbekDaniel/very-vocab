<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Very Vocab</title>
<meta name="description" content="Flashcards and quiz: stronger words instead of “very + adjective”, and the B1 Preliminary word list.">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --text:#1c1c1e; --muted:#6b6b70; --line:#e3e1dc;
  --accent:#d9480f; --accent-ink:#fff; --ok:#2b8a3e; --ok-bg:#e6f4ea; --bad:#c92a2a; --bad-bg:#fdecec;
  --r:12px; --gap:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1c1c1f; --text:#ececee; --muted:#9a9aa2; --line:#2c2c31;
    --accent:#ff7a3d; --accent-ink:#121214; --ok:#69db7c; --ok-bg:#1d2e21; --bad:#ff8787; --bad-bg:#341d1d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;min-width:0}
/* deck picker doubles as the page title */
.deck{position:relative;display:block;min-width:0}
.deck select{appearance:none;-webkit-appearance:none;max-width:100%;border:0;background:transparent;color:var(--text);
  font:inherit;font-size:20px;font-weight:700;letter-spacing:-.01em;padding:4px 22px 4px 0;cursor:pointer;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.deck::after{content:"";position:absolute;right:4px;top:50%;width:7px;height:7px;margin-top:-6px;
  border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:10px}
.tabs button{border:0;border-radius:7px;padding:10px;font:inherit;font-weight:600;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.word{overflow-wrap:break-word;hyphens:auto}
/* flashcard */
.card{perspective:1200px;height:260px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:20px 20px 40px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.face .word{font-size:clamp(28px,8vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15;max-width:100%}
.face.back .word{color:var(--accent)}
.face .tr,.pos{color:var(--muted)}
.pos{font-size:13px}
.ex{color:var(--muted);font-style:italic;font-size:15px;max-width:100%}
.pos:empty,.ex:empty,.face .tr:empty{display:none}
.face .hint{position:absolute;bottom:14px;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{color:var(--ok)} .btn.bad{color:var(--bad)}
.btn:focus-visible,.tabs button:focus-visible,.lang button:focus-visible,.card:focus-visible,.opt:focus-visible,.deck select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;justify-self:center;padding:4px}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center}
.q .prompt{color:var(--muted);font-size:14px;margin-bottom:6px}
.q .word{font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1.2}
.q .pos{margin-top:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-height:48px}
.opt kbd{flex:none;font:12px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.result .score{font-size:48px;font-weight:800;letter-spacing:-.03em}
.result p{margin:6px 0 0;color:var(--muted)}
.mist{list-style:none;padding:0;margin:16px 0 0;text-align:left;display:grid;gap:6px}
.mist li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px;font-size:15px}
.mist b{color:var(--accent);text-align:right}
[hidden]{display:none!important}
footer{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion: reduce){.card-in,.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <label class="deck"><span class="sr-only" data-i18n="deck"></span><select id="deck"></select></label>
    </h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-mode="cards" data-i18n="cards"></button>
    <button role="tab" data-mode="quiz" data-i18n="quiz"></button>
  </div>

  <!-- Flashcards -->
  <section id="cards">
    <div class="wrap">
      <div class="meta"><span id="cMeta"></span><span id="cKnown"></span></div>
      <div class="bar"><i id="cBar"></i></div>
      <div class="card" id="card" tabindex="0" role="button" aria-live="polite">
        <div class="card-in">
          <div class="face front">
            <span class="label" id="cFrontLabel"></span><span class="word" id="cFront"></span>
            <span class="pos" id="cPos"></span><span class="ex" id="cEx" lang="en"></span>
            <span class="hint" data-i18n="tapHint"></span>
          </div>
          <div class="face back"><span class="label" id="cBackLabel"></span><span class="word" id="cBack"></span><span class="tr" id="cTr" lang="ru"></span></div>
        </div>
      </div>
      <div class="row">
        <button class="btn bad" id="cAgain" data-i18n="again"></button>
        <button class="btn ok" id="cKnow" data-i18n="know"></button>
      </div>
      <button class="link" id="cReset" data-i18n="reset"></button>
    </div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="wrap" id="qPlay">
      <div class="meta"><span id="qMeta"></span><span id="qScore"></span></div>
      <div class="bar"><i id="qBar"></i></div>
      <div class="q"><div class="prompt" id="qPrompt"></div><div class="word" id="qWord"></div><div class="pos" id="qPos"></div></div>
      <div class="opts" id="qOpts"></div>
      <button class="btn primary" id="qNext" hidden></button>
    </div>
    <div class="wrap" id="qDone" hidden>
      <div class="result">
        <div class="score" id="rScore"></div>
        <p id="rMsg"></p>
        <ul class="mist" id="rList"></ul>
      </div>
      <button class="btn primary" id="qRestart" data-i18n="again2"></button>
    </div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

`.trim().split("\n").map(line=>{
  const [w,pos,ru,ex=""]=line.split("|");
  return {id:w,q:w,a:ru,pos,ex,group:pos.split(/[\s,&]/)[0]};
});

/* Each deck: q = prompt side, a = answer side. Quiz goes q→a, and 30% of the time a→q. */
const DECKS = {
  very:{key:"known", qLang:"en", aLang:"en",
        items:VERY.map(([w,s,ru])=>({id:w,q:"very "+w,a:s,tr:ru,pos:"",ex:"",group:""}))},
  b1:  {key:"known:b1", qLang:"en", aLang:"ru", items:B1}
};

const I18N = {
 ru:{deck:"Набор слов",cards:"Карточки",quiz:"Тест",tapHint:"Нажми, чтобы перевернуть",again:"Ещё раз",know:"Знаю",
     reset:"Начать заново",card:(i,n)=>`Карточка ${i} из ${n}`,known:(k,n)=>`Выучено: ${k}/${n}`,
     allDone:"Все карточки выучены! 🎉",
     qMeta:(i,n)=>`Вопрос ${i} из ${n}`,qScore:s=>`Счёт: ${s}`,next:"Дальше",finish:"Результат",again2:"Пройти ещё раз",
     msg:p=>p===100?"Идеально! Ты мастер слов.":p>=70?"Отлично! Почти всё знаешь.":p>=40?"Неплохо — потренируйся на карточках.":"Начни с карточек, потом попробуй снова.",
     mistakes:"Ошибки:",footer:"Тапни карточку или нажми Пробел. В тесте — клавиши 1–4.",
     decks:{
       very:{title:"Very → Stronger",front:"Вместо",back:"Скажи",qFwd:"Сильная замена для",qRev:"Какое «very + …» означает"},
       b1:{title:"B1 Preliminary · C",front:"Слово",back:"Перевод",qFwd:"Переведи",qRev:"Как это по-английски?"}
     }},
 en:{deck:"Word set",cards:"Flashcards",quiz:"Quiz",tapHint:"Tap to flip",again:"Again",know:"Got it",
     reset:"Start over",card:(i,n)=>`Card ${i} of ${n}`,known:(k,n)=>`Learned: ${k}/${n}`,
     allDone:"All cards learned! 🎉",
     qMeta:(i,n)=>`Question ${i} of ${n}`,qScore:s=>`Score: ${s}`,next:"Next",finish:"See result",again2:"Try again",
     msg:p=>p===100?"Perfect! Word master.":p>=70?"Great job! Almost there.":p>=40?"Not bad — practice with flashcards.":"Start with flashcards, then try again.",
     mistakes:"Mistakes:",footer:"Tap the card or press Space. In the quiz use keys 1–4.",
     decks:{
       very:{title:"Very → Stronger",front:"Instead of",back:"Say",qFwd:"Stronger word for",qRev:"Which “very + …” means"},
       b1:{title:"B1 Preliminary · C",front:"Word",back:"Translation",qFwd:"Translate",qRev:"Which English word means"}
     }}
};

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let lang = store.get("lang", (navigator.language||"ru").startsWith("ru")?"ru":"en");
let deckId = store.get("deck","very"); if(!DECKS[deckId]) deckId="very";
let mode = "cards";
const t = k => I18N[lang][k];
const td = k => I18N[lang].decks[deckId][k];
const D = () => DECKS[deckId];

/* ---------- Flashcards ---------- */
let deck, idx, known;
function cardsInit(reset){
  known = new Set(reset?[]:store.get(D().key,[]));
  deck = shuffle(D().items.filter(x=>!known.has(x.id)));
  idx = 0; renderCard();
}
function renderCard(){
  $("card").classList.remove("flipped");
  const items=D().items, n=items.length, done=!deck.length || idx>=deck.length;
  $("cFrontLabel").textContent=td("front"); $("cBackLabel").textContent=td("back");
  $("cKnown").textContent=t("known")(known.size,n);
  $("cBar").style.width=(known.size/n*100)+"%";
  $("cAgain").disabled=$("cKnow").disabled=done;
  if(done){
    if(deck.length && known.size<n){deck=shuffle(deck.filter(x=>!known.has(x.id)));idx=0;return renderCard();}
    $("cMeta").textContent=""; $("cFront").textContent=t("allDone");
    $("cPos").textContent=$("cEx").textContent=$("cBack").textContent=$("cTr").textContent=""; return;
  }
  const c=deck[idx];
  $("cMeta").textContent=t("card")(idx+1,deck.length);
  $("cFront").textContent=c.q; $("cFront").lang=D().qLang;
  $("cPos").textContent=c.pos; $("cEx").textContent=c.ex;
  // delay back text swap so the answer doesn't flash during un-flip
  setTimeout(()=>{$("cBack").textContent=c.a;$("cBack").lang=D().aLang;$("cTr").textContent=lang==="ru"&&c.tr||"";},150);
}
function flip(){ if(deck.length && idx<deck.length) $("card").classList.toggle("flipped"); }
function answerCard(ok){
  const c=deck[idx]; if(!c) return;
  if(ok){known.add(c.id);store.set(D().key,[...known]);}
  idx++; renderCard();
}
$("card").onclick=flip;
$("cKnow").onclick=()=>answerCard(true);
$("cAgain").onclick=()=>answerCard(false);
$("cReset").onclick=()=>{store.set(D().key,[]);cardsInit(true)};

/* ---------- Quiz ---------- */
const QN=10; let qs, qi, score, mistakes, answered;
// 3 distractors: same part of speech when possible, never sharing the right answer's text on either side.
function distractors(x, items){
  const pool=items.filter(y=>y.q!==x.q && y.a!==x.a), out=[], seenQ=new Set([x.q]), seenA=new Set([x.a]);
  for(const y of [...shuffle(pool.filter(y=>y.group===x.group)), ...shuffle(pool)]){
    if(out.length===3) break;
    if(seenQ.has(y.q)||seenA.has(y.a)) continue;
    seenQ.add(y.q); seenA.add(y.a); out.push(y);
  }
  return out;
}
function quizInit(){
  const items=D().items;
  qs = shuffle(items).slice(0,QN).map(x=>{
    const rev=Math.random()<.3; // 30%: reverse direction
    const opts=shuffle([x, ...distractors(x,items)]);
    return {x,rev,opts:opts.map(o=>rev?o.q:o.a),answer:rev?x.q:x.a};
  });
  qi=0; score=0; mistakes=[];
  $("qPlay").hidden=false; $("qDone").hidden=true; renderQ();
}
function renderQ(){
  const q=qs[qi], d=D(); answered=false;
  $("qMeta").textContent=t("qMeta")(qi+1,QN);
  $("qScore").textContent=t("qScore")(score);
  $("qBar").style.width=(qi/QN*100)+"%";
  $("qPrompt").textContent=q.rev?td("qRev"):td("qFwd");
  $("qWord").textContent=q.rev?q.x.a:q.x.q; $("qWord").lang=q.rev?d.aLang:d.qLang;
  $("qPos").textContent=q.rev?"":q.x.pos;
  $("qNext").hidden=true;
  $("qOpts").replaceChildren(...q.opts.map((o,i)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<kbd>${i+1}</kbd><span></span>`; b.lastChild.textContent=o; b.lastChild.lang=q.rev?d.qLang:d.aLang;
    b.onclick=()=>pick(i); return b;
  }));
}
function pick(i){
  if(answered || !qs[qi].opts[i]) return; answered=true;
  const q=qs[qi], btns=[...$("qOpts").children];
  btns.forEach((b,j)=>{b.disabled=true; if(q.opts[j]===q.answer) b.classList.add("correct");});
  if(q.opts[i]===q.answer) score++; else {btns[i].classList.add("wrong"); mistakes.push(q.x);}
  $("qScore").textContent=t("qScore")(score);
  $("qNext").textContent=qi===QN-1?t("finish"):t("next");
  $("qNext").hidden=false; $("qNext").focus({preventScroll:true});
}
function nextQ(){ if(++qi<QN) renderQ(); else showResult(); }
function showResult(){
  $("qPlay").hidden=true; $("qDone").hidden=false;
  const p=Math.round(score/QN*100);
  $("rScore").textContent=`${score}/${QN}`;
  $("rMsg").textContent=t("msg")(p);
  $("rList").replaceChildren(...(mistakes.length?[Object.assign(document.createElement("li"),{textContent:t("mistakes")})]:[]),
    ...mistakes.map(m=>{const li=document.createElement("li");li.innerHTML=`<span></span><b></b>`;li.firstChild.textContent=m.q;li.lastChild.textContent=m.a;return li;}));
}
$("qNext").onclick=nextQ;
$("qRestart").onclick=quizInit;

/* ---------- Shell ---------- */
function renderDeckPicker(){
  $("deck").replaceChildren(...Object.keys(DECKS).map(id=>
    Object.assign(document.createElement("option"),{value:id,textContent:I18N[lang].decks[id].title})));
  $("deck").value=deckId;
  document.title=td("title");
}
function applyLang(){
  document.documentElement.lang=lang; store.set("lang",lang);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  renderDeckPicker();
  renderCard();
  if(qs){
    if(!$("qDone").hidden) return showResult();
    const q=qs[qi];
    $("qMeta").textContent=t("qMeta")(qi+1,QN); $("qScore").textContent=t("qScore")(score);
    $("qPrompt").textContent=q.rev?td("qRev"):td("qFwd");
    $("qNext").textContent=qi===QN-1?t("finish"):t("next");
  }
}
function setDeck(id){
  deckId=id; store.set("deck",id);
  renderDeckPicker(); cardsInit(false);
  qs=null; if(mode==="quiz") quizInit();
}
function setMode(m){
  mode=m;
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  $("cards").hidden=m!=="cards"; $("quiz").hidden=m!=="quiz";
  if(m==="quiz" && !qs) quizInit();
}
$("deck").onchange=e=>{setDeck(e.target.value); e.target.blur();};
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(mode==="cards"){
    if(e.code==="Space"||e.key==="Enter"){ if(e.target.tagName!=="BUTTON"||e.target.id==="card"){e.preventDefault();flip();} }
    else if(e.key==="ArrowRight") answerCard(true);
    else if(e.key==="ArrowLeft") answerCard(false);
  } else if(!$("qPlay").hidden){
    if(/^[1-4]$/.test(e.key)) pick(+e.key-1);
    else if(e.key==="Enter" && answered && e.target.id!=="qNext"){e.preventDefault();nextQ();}
  }
});

cardsInit(false); applyLang(); setMode("cards");
</script>
</body>
